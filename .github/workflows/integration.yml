name: Home Assistant integration

on:
  push:
    branches: ["main"]
    paths: ["custom_components/**", "tests/**", "hacs.json", "pyproject.toml", ".github/workflows/integration.yml"]
  pull_request:
    paths: ["custom_components/**", "tests/**", "hacs.json", "pyproject.toml"]
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check custom_components tests

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test framework + the integration's own requirements (from manifest.json)
        run: |
          pip install pytest-homeassistant-custom-component
          pip install $(python -c "import json; print(' '.join(json.load(open('custom_components/steamos/manifest.json'))['requirements']))")
      - run: python -m pytest tests -q
